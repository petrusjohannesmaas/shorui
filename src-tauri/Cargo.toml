[package]
name = "shorui"
version = "0.2.0"
edition = "2021"

[lib]
name = "shorui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The WebdriverIO plugins are behind an optional feature, so a normal build
# never compiles them. Cargo ignores debug_assertions in a target selector, so
# `npm run test:e2e` passes `--features wdio` instead.
[features]
wdio = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[dependencies.tauri-plugin-wdio]
version = "1"
optional = true

[dependencies.tauri-plugin-wdio-webdriver]
version = "1"
optional = true
